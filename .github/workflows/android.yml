# Builds the Android app on GitHub's servers every time the game is pushed.
# TEST:       mini-kingdoms-TEST-1.0.X.apk  - install on your phone; Google's test ads only.
# PRODUCTION: mini-kingdoms-PRODUCTION-1.0.X.aab - upload to Google Play; your real ads
#             (built only when the 4 signing secrets are set, see PLAY_STORE.md).
# Both appear under Actions -> the run -> "Artifacts".
name: Android build

on:
  push:
    branches: [mini-kingdoms, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04          # has the Android SDK already installed
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Android SDK (already on the server)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Install Capacitor
        run: npm ci

      - name: Copy the game into the Android project
        run: |
          npx cap sync android
          # safety: the shared game files must always be the TEST ones; only the production flavor overrides env.js
          grep -q "APP_ENV = 'test'" android/app/src/main/assets/public/env.js
          grep -q "APP_ENV = 'production'" android/app/src/production/assets/public/env.js

      - name: Build TEST (Google's test ads, installs next to the store app)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDevDebug --no-daemon

      - name: Signing key (only when the secrets exist)
        id: key
        if: env.HAS_KEY == 'true'
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build PRODUCTION for Google Play (real ads, signed)
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleProductionRelease --no-daemon

      - name: Check which ads each build shows
        working-directory: android/app/build/outputs
        run: |
          unzip -p apk/dev/debug/app-dev-debug.apk assets/public/env.js | tee /dev/stderr | grep -q "APP_ENV = 'test'"
          echo "TEST apk: test ads ✔"
          if [ -f bundle/productionRelease/app-production-release.aab ]; then
            unzip -p bundle/productionRelease/app-production-release.aab base/assets/public/env.js | tee /dev/stderr | grep -q "APP_ENV = 'production'"
            echo "PRODUCTION aab: real ads ✔"
          fi

      - name: Check the PRODUCTION build works (no key yet; built and thrown away, never uploaded)
        if: env.HAS_KEY != 'true'
        working-directory: android
        run: |
          ./gradlew assembleProductionDebug --no-daemon
          unzip -p app/build/outputs/apk/production/debug/app-production-debug.apk assets/public/env.js | grep -q "APP_ENV = 'production'"
          echo "PRODUCTION build: real ads ✔ (file deleted)"
          rm -rf app/build/outputs/apk/production

      - name: Name the files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/dev/debug/app-dev-debug.apk "out/mini-kingdoms-TEST-${VERSION_NAME}.apk"
          if [ -f android/app/build/outputs/bundle/productionRelease/app-production-release.aab ]; then
            cp android/app/build/outputs/bundle/productionRelease/app-production-release.aab "out/mini-kingdoms-PRODUCTION-${VERSION_NAME}.aab"
          fi
          ls -la out

      - uses: actions/upload-artifact@v5
        with:
          name: mini-kingdoms-${{ env.VERSION_NAME }}
          path: out/*
          retention-days: 30
